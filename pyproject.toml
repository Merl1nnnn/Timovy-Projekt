[project]
name = "skillminer"
version = "0.1.0"
description = "SkillMiner prototype: mock job sites -> scraper -> LLM parser -> SQLite -> Streamlit"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pandas>=2.2",
    "playwright>=1.48",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "streamlit>=1.40",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
