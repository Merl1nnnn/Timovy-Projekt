<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}{% endblock %} | LinkedIn Jobs MOCK</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; background: #f3f2ef; color: #191919; }
  .mock-banner { background: #ffd54a; text-align: center; padding: 4px; font-size: 12px; font-weight: bold; }
  .global-nav { background: #fff; border-bottom: 1px solid #e0e0e0; padding: 10px 32px; display: flex; gap: 28px; align-items: center; }
  .global-nav .brand { font-weight: 700; color: #0a66c2; font-size: 20px; }
  .global-nav input { padding: 6px 10px; border-radius: 4px; border: none; background: #edf3f8; width: 240px; }
  .global-nav a { color: #666; text-decoration: none; font-size: 13px; }
  main.scaffold { max-width: 1040px; margin: 20px auto; display: grid; grid-template-columns: 1fr; gap: 16px; }
  .card { background: #fff; border-radius: 8px; box-shadow: 0 0 0 1px rgba(0,0,0,.08); padding: 16px 24px; }
  ul.jobs-search__results-list { list-style: none; padding: 0; margin: 0; }
  ul.jobs-search__results-list li { border-bottom: 1px solid #eee; padding: 12px 0; }
  .base-search-card__title { margin: 0; font-size: 16px; color: #0a66c2; }
  .base-search-card__subtitle { margin: 2px 0; font-size: 14px; font-weight: 400; }
  .job-search-card__location { color: #666; font-size: 13px; }
  .job-search-card__salary-info { color: #057642; font-size: 13px; margin-left: 8px; }
  time { color: #057642; font-size: 12px; display: block; }
  .base-card__full-link { text-decoration: none; }
  .sr-only { position: absolute; left: -9999px; }
  .artdeco-pagination { display: flex; gap: 4px; list-style: none; padding: 0; justify-content: center; }
  .artdeco-pagination a, .artdeco-pagination span { padding: 6px 12px; border-radius: 4px; text-decoration: none; color: #666; }
  .artdeco-pagination .active span { background: #0a66c2; color: #fff; }
  .top-card-layout__title { font-size: 24px; margin: 0 0 6px; }
  .topcard__flavor-row { color: #666; font-size: 14px; }
  .topcard__flavor-row > * { margin-right: 8px; }
  .job-insight { list-style: none; font-size: 14px; margin: 4px 0; }
  .description__job-criteria-list { list-style: none; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .description__job-criteria-subheader { font-size: 13px; color: #666; margin: 0; }
  .description__job-criteria-text { font-size: 14px; margin: 0; }
  footer { text-align: center; color: #888; font-size: 12px; padding: 24px; }
</style>
</head>
<body>
<div class="mock-banner">MOCK — SkillMiner student prototype. Fictional data, not a real website.</div>
<nav class="global-nav">
  <span class="brand">in&nbsp;MOCK</span>
  <input type="search" placeholder="Search jobs" aria-label="Search jobs">
  <a href="#">Home</a><a href="#">My Network</a><a href="{{ list_path(1) }}">Jobs</a><a href="#">Messaging</a>
</nav>
<main class="scaffold">
{% block content %}{% endblock %}
</main>
<footer>LinkedIn Jobs MOCK © 2026 · student project · all companies are fictional</footer>
</body>
</html>
