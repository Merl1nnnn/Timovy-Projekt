<!doctype html>
<html lang="sk" data-theme="original" data-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkillMiner</title>
  <script>
    try {
      const theme = localStorage.getItem('skillminer-theme');
      if (['original', 'classic', 'zive', 'tuke', 'nik'].includes(theme)) {
        document.documentElement.dataset.theme = theme;
      }
      const mode = localStorage.getItem('skillminer-mode');
      document.documentElement.dataset.mode = (mode === 'light' || mode === 'dark')
        ? mode : (theme === 'zive' || theme === 'dark' ? 'dark' : 'light');
    } catch {}
  </script>
  <link rel="stylesheet" href="style.css?v=analytics-3">
  <script src="i18n.js?v=5" defer></script>
  <script src="interface-i18n.js?v=4" defer></script>
  <script src="jobs-model.js?v=2" defer></script>
  <script src="analytics-model.js?v=2" defer></script>
  <script src="analytics-i18n.js?v=1" defer></script>
  <script src="analytics-comparison-i18n.js?v=1" defer></script>
  <script src="analytics-salary-i18n.js?v=1" defer></script>
  <script src="analytics-fx.js?v=1" defer></script>
  <script src="analytics-comparison-ui.js?v=2" defer></script>
  <script src="analytics-ui.js?v=3" defer></script>
  <script src="app.js?v=analytics-1" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/overview" aria-label="SkillMiner"><span class="brand-icon" aria-hidden="true">▦</span><span class="brand-name">SkillMiner</span></a>
      <button id="menu-toggle" class="menu-toggle" type="button" aria-expanded="false" aria-controls="app-nav" data-i18n-aria="toggleMenu">☰</button>
      <div class="sidebar-scroll">
        <nav class="sidebar-nav" id="app-nav" data-i18n-aria="navigation">
          <a href="#/overview" data-route="overview" data-i18n-aria="overview"><span aria-hidden="true">▦</span><span data-i18n="overview"></span></a>
          <a href="#/postings" data-route="postings" data-i18n-aria="postings"><span aria-hidden="true">▤</span><span data-i18n="postings"></span></a>
          <a href="#/analytics" data-route="analytics" data-i18n-aria="analytics"><span aria-hidden="true">▥</span><span data-i18n="analytics"></span></a>
          <a href="#/settings" data-route="settings" data-i18n-aria="settings"><span aria-hidden="true">⚙</span><span data-i18n="settings"></span></a>
          <a href="#/about" data-route="about" data-i18n-aria="about"><span aria-hidden="true">ⓘ</span><span data-i18n="about"></span></a>
        </nav>
        <button class="filter-toggle secondary" id="filter-toggle" type="button" aria-expanded="false"
                aria-controls="filter-panel" data-i18n-aria="filters">☷</button>
        <aside id="filter-panel" class="panel filter-panel" aria-labelledby="filters-title">
          <div class="section-title">
            <h2 id="filters-title" data-i18n="filters"></h2>
            <div class="filter-actions">
              <button id="reset" type="button" class="secondary" data-i18n="reset"></button>
              <button class="filter-close secondary" id="filter-close" type="button" data-i18n-aria="close">✕</button>
            </div>
          </div>
          <div class="filter-fields">
            <label class="full-row"><span data-i18n="search"></span><input id="search" type="search"></label>
            <label class="full-row"><span data-i18n="specialization"></span><select id="specialization"><option value="" data-i18n="allFilterValues"></option></select></label>
            <label><span data-i18n="seniority"></span><select id="seniority"><option value="" data-i18n="allFilterValues"></option></select></label>
            <label><span data-i18n="location"></span><select id="location"><option value="" data-i18n="allFilterValues"></option></select></label>
            <label><span data-i18n="site"></span><select id="site"><option value="" data-i18n="allFilterValues"></option></select></label>
            <label><span data-i18n="company_size"></span>
              <select id="company_size">
                <option value="" data-i18n="allFilterValues"></option><option value="small" data-i18n="small"></option>
                <option value="medium" data-i18n="medium"></option><option value="large" data-i18n="large"></option>
                <option value="unknown" data-i18n="unknown"></option>
              </select>
            </label>
            <div class="filter-checks">
              <label class="check"><input id="doubtful" type="checkbox"><span data-i18n="doubtful"></span></label>
              <label class="check"><input id="duplicates" type="checkbox"><span data-i18n="possibleDuplicates"></span></label>
            </div>
          </div>
        </aside>
      </div>
      <div class="sidebar-tools">
        <label class="language-control"><span data-i18n="language"></span>
          <select id="language" data-i18n-aria="language">
            <option value="uk" lang="uk">UA</option><option value="sk" lang="sk">SK</option>
            <option value="cs" lang="cs">CZ</option><option value="en" lang="en">EN</option>
            <option value="de" lang="de">DE</option>
          </select>
        </label>
        <button class="mode-toggle secondary" id="mode-toggle" type="button" aria-pressed="false" data-i18n-aria="darkMode">
          <span id="mode-icon" aria-hidden="true">☀</span><span class="mode-label" id="mode-label"></span>
        </button>
      </div>
    </aside>

    <main id="main-content">
      <div class="dataset-bar">
        <span data-i18n="datasetSwitch"></span>
        <div class="segmented" role="group" data-i18n-aria="datasetSwitch">
          <button id="data-synthetic" type="button" class="active" aria-pressed="true" data-i18n="dataMock"></button>
          <button id="data-real" type="button" aria-pressed="false" data-i18n="dataReal"></button>
        </div>
      </div>
      <section class="screen" id="screen-overview" aria-labelledby="overview-title">
        <header class="screen-heading">
          <div><h1 id="overview-title" tabindex="-1" data-i18n="overview"></h1><p data-i18n="dashboardIntro"></p></div>
          <div class="stamp" role="status"><span class="dot"></span><span id="dataset"></span><small id="updated"></small><small id="checked"></small></div>
        </header>
        <p class="notice" id="notice"></p>
        <section class="metrics" data-i18n-aria="metrics">
          <article><span data-i18n="count"></span><strong id="count">—</strong></article>
          <article><span data-i18n="skills"></span><strong id="skills">—</strong></article>
          <article><span data-i18n="review"></span><strong id="review">—</strong></article>
          <article><span data-i18n="remote"></span><strong id="remote">—</strong></article>
        </section>
        <details class="panel changes" id="changes">
          <summary><span class="changes-icon" aria-hidden="true">↻</span><span data-i18n="changes"></span><span id="change-count" class="pill">—</span></summary>
          <div id="change-list" class="change-list"></div>
        </details>
      </section>

      <section class="screen" id="screen-postings" aria-labelledby="postings-title" hidden>
        <header class="screen-heading">
          <h1 id="postings-title" tabindex="-1" data-i18n="postings"></h1>
          <button id="export" type="button" class="secondary" data-i18n="export" disabled></button>
        </header>
        <div id="postings" class="panel postings">
          <div class="section-title"><h2><span data-i18n="resultsLabel"></span> <span id="shown" class="pill"></span></h2></div>
          <p id="status" role="status" hidden></p>
          <div class="table-wrap" id="job-table" hidden>
            <table>
              <thead><tr><th data-i18n="position"></th><th data-i18n="company"></th><th data-i18n="salary"></th><th data-i18n="site"></th></tr></thead>
              <tbody id="jobs"></tbody>
            </table>
          </div>
          <button id="more" type="button" class="secondary more" data-i18n="more" hidden></button>
        </div>
      </section>

      <section class="screen" id="screen-analytics" aria-labelledby="analytics-title" hidden>
        <header class="screen-heading">
          <div><span class="eyebrow" data-i18n="skillExplorer"></span><h1 id="analytics-title" tabindex="-1" data-i18n="analytics"></h1><p data-i18n="analyticsIntro"></p></div>
          <span id="analytics-kind" class="analytics-dataset"></span>
        </header>
        <div id="analytics" class="analytics">
          <article class="panel skill-picker">
            <div class="section-title"><div><h2 data-i18n="chooseSkills"></h2><p id="analytics-quality"></p></div><button id="skill-clear" type="button" class="secondary" data-i18n="clearSkills"></button></div>
            <div class="skill-selected-row"><span class="and-badge">AND</span><div id="selected-skills" class="skill-chips" aria-live="polite"></div></div>
            <p class="analytics-hint" data-i18n="allSelectedSkills"></p>
            <label class="skill-search-label"><span class="sr-only" data-i18n="searchSkill"></span><input type="search" id="skill-search" autocomplete="off" data-i18n-placeholder="searchSkill"></label>
            <div id="skill-catalog" class="skill-chips skill-catalog" role="group" data-i18n-aria="chooseSkills"></div>
            <button id="skill-more" type="button" class="link-button"></button>
            <div class="analytics-controls">
              <label><span data-i18n="period"></span><select id="period"><option value="0" data-i18n="allDates" selected></option><option value="7" data-i18n="last7"></option><option value="30" data-i18n="last30"></option><option value="90" data-i18n="last90"></option></select></label>
              <label><span data-i18n="dateFrom"></span><input type="date" id="analytics-from"></label>
              <label><span data-i18n="dateTo"></span><input type="date" id="analytics-to"></label>
              <label><span data-i18n="offerCurrency"></span><select id="analytics-pay-currency"></select></label>
              <label><span data-i18n="offerPeriod"></span><select id="analytics-pay-period"><option value="month" data-i18n="month"></option><option value="year" data-i18n="year"></option><option value="hour" data-i18n="hour"></option></select></label>
            </div>
            <p id="analytics-scope" class="analytics-hint" aria-live="polite"></p>
            <p id="analytics-conversion-note" class="analytics-hint"></p>
            <p id="analytics-fx-note" class="analytics-hint"><a id="analytics-fx-source" href="https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/index.en.html" target="_blank" rel="noopener"></a></p>
          </article>
          <article class="panel chart-panel">
            <div class="section-title"><div><h2 data-i18n="funnelTitle"></h2><p data-i18n="funnelIntro"></p></div></div>
            <div id="skill-funnel" class="skill-funnel" aria-live="polite"></div>
            <p id="skill-funnel-note" class="analytics-hint"></p>
          </article>
          <div id="analytics-metrics" class="metrics analytics-metrics" aria-live="polite">
            <article><span data-i18n="matchingJobs"></span><strong id="analytics-count">—</strong><small id="analytics-total"></small></article>
            <article><span data-i18n="demandShare"></span><strong id="analytics-share">—</strong><small data-i18n="withinChecked"></small></article>
            <article><span data-i18n="medianMinimum"></span><strong id="analytics-median">—</strong><small id="analytics-pay-sample"></small></article>
            <article><span data-i18n="company"></span><strong id="analytics-companies">—</strong><small id="analytics-remote"></small></article>
          </div>
          <p id="analytics-pay-coverage" class="analytics-hint"></p>
          <p id="analytics-empty" class="analytics-empty" data-i18n="noSkillMatches" hidden></p>
          <div class="chart-grid">
            <article class="panel chart-panel"><div class="section-title"><div><h2 data-i18n="observedDemand"></h2><p data-i18n="demandMethod"></p></div></div><div id="activity-legend" class="chart-legend"></div><div id="activity"></div></article>
            <article class="panel chart-panel"><div class="section-title"><div><h2 data-i18n="salaryTrend"></h2><p data-i18n="salaryMethod"></p></div></div><div id="analytics-pay-trend"></div></article>
          </div>
          <p id="analytics-date-note" class="analytics-hint"></p>
          <div class="chart-grid">
            <article class="panel chart-panel"><div class="section-title"><div><h2 data-i18n="salaryDistribution"></h2><p id="analytics-pay-range"></p></div></div><div id="analytics-histogram"></div></article>
            <article class="panel chart-panel"><div class="section-title"><h2 data-i18n="distribution"></h2><label class="period"><span class="sr-only" data-i18n="distribution"></span><select id="group-by"><option value="seniority" data-i18n="seniority"></option><option value="location" data-i18n="location"></option><option value="specialization" data-i18n="specialization"></option></select></label></div><div id="distribution"></div></article>
          </div>
          <div class="chart-grid">
            <article class="panel chart-panel related-skills-panel"><div class="section-title"><div><h2 data-i18n="relatedSkills"></h2><p data-i18n="relatedSkillsNote"></p></div><div class="segmented" role="group" data-i18n-aria="rankMode"><button id="rank-required" type="button" class="active" aria-pressed="true" data-i18n="rankRequired"></button><button id="rank-nice" type="button" aria-pressed="false" data-i18n="rankNice"></button></div></div><div id="bars"></div></article>
            <article class="panel chart-panel"><div class="section-title"><div><h2 data-i18n="payComparison"></h2><p data-i18n="payMethod"></p></div></div><div id="pay-comparison"></div></article>
          </div>
          <article class="panel chart-panel"><div class="section-title"><div><h2 data-i18n="matchingPostings"></h2><p data-i18n="matchingPostingsNote"></p></div><span id="analytics-result-count" class="pill"></span></div><div id="analytics-results" class="table-wrap"></div><button id="analytics-more" type="button" class="secondary" data-i18n="more"></button></article>
          <article class="panel chart-panel comparison-panel" id="company-offer">
            <div class="section-title"><div><h2 data-i18n="firmOffer"></h2><p data-i18n="firmOfferIntro"></p></div></div>
            <p class="analytics-hint comparison-scope" data-i18n="independentProfiles"></p>
            <div class="offer-layout">
              <div>
                <h3 data-i18n="offerRequirements"></h3><div id="offer-profile-controls" class="profile-controls"></div>
                <div class="offer-pay-fields">
                  <label><span data-i18n="offerGross"></span><input id="offer-amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="2600" autocomplete="off"></label>
                  <label><span data-i18n="offerCurrency"></span><select id="offer-currency"></select></label>
                  <label><span data-i18n="offerPeriod"></span><select id="offer-period"><option value="month" data-i18n="month"></option><option value="year" data-i18n="year"></option><option value="hour" data-i18n="hour"></option></select></label>
                </div>
              </div>
              <div id="offer-result" class="offer-result" aria-live="polite"></div>
            </div>
            <p class="analytics-hint" data-i18n="profileScopeNote"></p>
            <p class="analytics-hint" data-i18n="comparisonLocal"></p>
          </article>
          <article class="panel chart-panel comparison-panel" id="profile-comparison">
            <div class="section-title"><div><h2 data-i18n="comparisonProfiles"></h2><p data-i18n="comparisonProfilesIntro"></p></div></div>
            <p class="analytics-hint comparison-scope" data-i18n="independentProfiles"></p>
            <div class="profiles-grid">
              <section class="profile-card profile-a" aria-labelledby="profile-a-title"><div class="section-title"><h3 id="profile-a-title" data-i18n="profileA"></h3><button type="button" id="profile-a-example" class="link-button"></button></div><div id="profile-a-profile-controls" class="profile-controls"></div></section>
              <section class="profile-card profile-b" aria-labelledby="profile-b-title"><div class="section-title"><h3 id="profile-b-title" data-i18n="profileB"></h3><button type="button" id="profile-b-example" class="link-button"></button></div><div id="profile-b-profile-controls" class="profile-controls"></div></section>
            </div>
            <div class="profile-unit-fields"><label><span data-i18n="offerCurrency"></span><select id="profiles-currency"></select></label><label><span data-i18n="offerPeriod"></span><select id="profiles-period"><option value="month" data-i18n="month"></option><option value="year" data-i18n="year"></option><option value="hour" data-i18n="hour"></option></select></label></div>
            <div class="profiles-grid profile-plots"><section><h3 data-i18n="comparisonCounts"></h3><div id="profiles-count-chart"></div></section><section><h3 id="profiles-pay-title"></h3><div id="profiles-pay-chart"></div></section></div>
            <div id="profiles-table" class="table-wrap" aria-live="polite"></div>
            <p id="profiles-overlap" class="analytics-hint"></p><p id="profiles-difference" class="profile-difference"></p>
            <p class="analytics-hint" data-i18n="comparisonMethod"></p><p class="analytics-hint" data-i18n="profileScopeNote"></p>
          </article>
        </div>
      </section>

      <section class="screen" id="screen-settings" aria-labelledby="settings-title" hidden>
        <header class="screen-heading"><h1 id="settings-title" tabindex="-1" data-i18n="settings"></h1></header>
        <div class="panel preferences">
          <fieldset id="theme-choices">
            <legend data-i18n="theme"></legend>
            <div class="themes">
              <label class="theme-choice"><input type="radio" name="theme" value="original"><span class="swatches swatch-original" aria-hidden="true"></span><span>Original</span></label>
              <label class="theme-choice"><input type="radio" name="theme" value="classic"><span class="swatches swatch-classic" aria-hidden="true"></span><span>Classic</span></label>
              <label class="theme-choice"><input type="radio" name="theme" value="zive"><span class="swatches swatch-zive" aria-hidden="true"></span><span>Zive IT</span></label>
              <label class="theme-choice"><input type="radio" name="theme" value="tuke"><span class="swatches swatch-tuke" aria-hidden="true"></span><span>TUKE FEI</span></label>
              <label class="theme-choice"><input type="radio" name="theme" value="nik"><span class="swatches swatch-nik" aria-hidden="true"></span><span>Nik</span></label>
            </div>
          </fieldset>
          <div class="view-preferences">
            <label><span data-i18n="rowsPerPage"></span>
              <select id="rows-per-page"><option>10</option><option selected>15</option><option>25</option><option>50</option></select>
            </label>
            <label><span data-i18n="defaultPeriod"></span>
              <select id="default-period"><option value="7" data-i18n="last7"></option><option value="30" data-i18n="last30" selected></option><option value="90" data-i18n="last90"></option></select>
            </label>
          </div>
        </div>
        <div class="panel preferences account-panel">
          <button type="button" class="secondary" disabled aria-describedby="account-demo" data-i18n="account"></button>
          <p id="account-demo" data-i18n="accountDemo"></p>
        </div>
      </section>

      <section class="screen" id="screen-about" aria-labelledby="about-title" hidden>
        <header class="screen-heading"><h1 id="about-title" tabindex="-1" data-i18n="about"></h1></header>
        <article class="panel preferences about-panel">
          <h2>SkillMiner</h2>
          <p data-i18n="aboutProject"></p>
          <a href="https://github.com/Merl1nnnn/Timovy-Projekt" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
        </article>
      </section>
    </main>
  </div>
  <dialog id="detail" aria-labelledby="detail-title">
    <button id="close" class="secondary close" type="button" data-i18n-aria="close">✕</button>
    <div id="detail-content"></div>
  </dialog>
</body>
</html>
